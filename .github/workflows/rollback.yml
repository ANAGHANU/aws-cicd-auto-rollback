name: Application Rollback

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: devops-aws-cicd-app

jobs:
  rollback:
    name: Rollback Application
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::340593397664:role/devops-aws-cicd-github-application
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: 340593397664

      - name: Get EC2 instance ID
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=devops-aws-cicd-app" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "Running application EC2 instance not found."
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Rollback application
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          DEPLOY_SCRIPT=$(cat <<'EOF'
          set -e

          APP_DIR="/opt/devops-aws-cicd"
          ECR_REGISTRY="340593397664.dkr.ecr.ap-south-1.amazonaws.com"
          ECR_REPOSITORY="devops-aws-cicd-app"
          AWS_REGION="ap-south-1"

          cd "$APP_DIR"

          echo "Checking previous image tag..."

          if [ ! -f previous_image_tag ]; then
            echo "No previous image tag found. Rollback cannot continue."
            exit 1
          fi

          ROLLBACK_TAG=$(cat previous_image_tag)

          if [ -z "$ROLLBACK_TAG" ]; then
            echo "Previous image tag is empty."
            exit 1
          fi

          CURRENT_TAG=$(cat current_image_tag)

          echo "Current image before rollback:"
          echo "$CURRENT_TAG"

          echo "Rollback target:"
          echo "$ROLLBACK_TAG"

          echo "Logging in to ECR..."

          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

          export ECR_REGISTRY
          export ECR_REPOSITORY
          export IMAGE_TAG="$ROLLBACK_TAG"

          echo "Pulling rollback image..."

          docker compose -f docker-compose.prod.yml pull

          echo "Starting rollback deployment..."

          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          docker compose -f docker-compose.prod.yml ps

          echo "Waiting for rollback health check..."

          for i in {1..12}; do
            if curl --fail --silent http://localhost/health; then
              echo "Rollback health check passed."

              echo "Updating image tracking..."

              echo "$CURRENT_TAG" > previous_image_tag
              echo "$ROLLBACK_TAG" > current_image_tag

              echo "Current image after rollback:"
              cat current_image_tag

              echo "Previous image after rollback:"
              cat previous_image_tag

              exit 0
            fi

            echo "Rollback health check attempt $i failed. Retrying..."
            sleep 5
          done

          echo "Rollback health check failed."
          exit 1
          EOF
          )

          SCRIPT_CONTENT=$(printf '%s\n' "$DEPLOY_SCRIPT" | base64 -w 0)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Rollback application" \
            --parameters "commands=[\"echo '$SCRIPT_CONTENT' | base64 -d > /tmp/devops-rollback.sh\", \"chmod +x /tmp/devops-rollback.sh\", \"/tmp/devops-rollback.sh\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "Rollback status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Rollback completed successfully."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text

                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Rollback failed."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Rollback timed out."
          exit 1