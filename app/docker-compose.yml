services:
  app:
    build:
      context: .
    container_name: devops-aws-cicd-app
    expose:
      - "5000"
    restart: unless-stopped
    
  nginx:
    image: nginx:1.29-alpine
    container_name: devops-aws-cicd-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped